[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stadium-reaper-bridge"
version = "0.1.0"
description = "Lossless foundation for Helix Stadium Song and REAPER conversion"
requires-python = ">=3.9"
dependencies = ["audioop-lts>=0.2.1; python_version >= '3.13'"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
]

[project.optional-dependencies]
desktop-audio = ["sounddevice>=0.5,<1"]
desktop-midi = ["mido>=1.3,<2", "python-rtmidi>=1.5,<2"]

[tool.setuptools.packages.find]
where = ["src"]
