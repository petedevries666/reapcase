[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stadium-reaper-bridge"
version = "0.1.0"
description = "Lossless foundation for Helix Stadium Song and REAPER conversion"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]
